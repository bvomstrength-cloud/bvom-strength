<script>
const BVOM_BUILD='2.8.9';
const programs={A:[["Squat",3,5],["Bench Press",3,5],["Prone Row",3,5]],B:[["Squat",3,5],["Overhead Press",5,5],["Deadlift",1,5]]};
function liftLabel(n){return n==='Prone Row'?(isHLM()?'Prone Row':'Row'):n==='Overhead Press'?'Press':n;}
const inc={Squat:2.5,"Bench Press":2.5,"Prone Row":2.5,"Overhead Press":2.5,Deadlift:5};
const profiles={
 male:{"Overhead Press":.50,"Bench Press":.75,"Prone Row":.75,Deadlift:1.25},
 female:{"Overhead Press":.40,"Bench Press":.60,"Prone Row":.60,Deadlift:1.20}
};
const BVOM_DATA_KEY="bvom_data";
const BVOM_DATA_OWNER_KEY="bvom_data_owner";
const BVOM_ACCOUNT_SWITCH_BACKUP_KEY="bvom_account_switch_backup";
const BVOM_WORKOUT_TAB_OWNER_KEY="bvom_workout_tab_owner";
const BVOM_TAB_SESSION_KEY="bvom_tab_id";
window.__bvomAuthUserId=null;
function loadBVOMData(){
 try{let x=localStorage.getItem(BVOM_DATA_KEY);if(x)return JSON.parse(x)}catch(e){}
 for(const k of ["bvom13","bvom12"]){
  try{let x=localStorage.getItem(k);if(x){let d=JSON.parse(x);localStorage.setItem(BVOM_DATA_KEY,JSON.stringify(d));return d}}catch(e){}
 }
 return null;
}
const bvomLoadedData=loadBVOMData();
// Boot-time presence is retained only to recognise untagged pre-16.1 local data.
// The app itself writes a default bvom_data blob during migration, so raw key presence later
// must never be treated as proof that meaningful user-owned data existed before this load.
const bvomHadLocalData=!!bvomLoadedData;
function bvomLocalOwnerId(){try{return localStorage.getItem(BVOM_DATA_OWNER_KEY)||''}catch(e){return ''}}

function bvomTabId(){
 try{
  let id=sessionStorage.getItem(BVOM_TAB_SESSION_KEY);
  if(!id){id=(globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')?globalThis.crypto.randomUUID():('tab_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));sessionStorage.setItem(BVOM_TAB_SESSION_KEY,id)}
  return id;
 }catch(e){return 'tab_fallback'}
}
function bvomWorkoutTabOwnerId(){try{return localStorage.getItem(BVOM_WORKOUT_TAB_OWNER_KEY)||''}catch(e){return ''}}
function bvomMarkThisTabAsWorkoutOwner(){try{const id=bvomTabId();localStorage.setItem(BVOM_WORKOUT_TAB_OWNER_KEY,id);return id}catch(e){return ''}}
function bvomReleaseWorkoutTabOwnerIfThisTab(){try{const id=bvomTabId();if(localStorage.getItem(BVOM_WORKOUT_TAB_OWNER_KEY)===id)localStorage.removeItem(BVOM_WORKOUT_TAB_OWNER_KEY)}catch(e){}}
function bvomSecondaryTabWriteBlocked(){
 try{
  if(!bvomStateWorkoutActive(state))return false;
  const owner=bvomWorkoutTabOwnerId();
  return !!(owner&&owner!==bvomTabId());
 }catch(e){return false}
}
function bvomSetLocalOwnerId(id){try{if(id)localStorage.setItem(BVOM_DATA_OWNER_KEY,String(id));else localStorage.removeItem(BVOM_DATA_OWNER_KEY)}catch(e){}}
function bvomArchiveForeignLocalData(){
 try{
  const raw=localStorage.getItem(BVOM_DATA_KEY);
  if(raw)localStorage.setItem(BVOM_ACCOUNT_SWITCH_BACKUP_KEY,JSON.stringify({saved_at:new Date().toISOString(),owner_id:bvomLocalOwnerId()||null,data:JSON.parse(raw)}));
 }catch(e){}
}
function bvomReplaceLocalForAccount(userId,data){

function renderInfo(){
let h=`<div class="infoHero"><img src="./icon-192.png" alt="BVOM Power Bee"><h2>BVOM</h2><b>BEST VERSION OF MYSELF</b><div class="tagline">Simple progression. Intelligent adjustment. Get stronger.</div></div>

<div class="infoCard"><h3>Why BVOM?</h3><p>BVOM grew out of more than a decade of experience helping novice lifters get stronger — from tradespeople with bad backs, to surfers with upper-body and leg-strength imbalances, to older lifters wanting to remain strong and capable, and complete beginners.</p><p>Most beginners don't need complicated training. Learn the basic movements, train consistently, gradually add weight and allow your body to adapt. That's <b>progressive overload</b>.</p><p>Resistance training provides a progressive stimulus to muscles, tendons, connective tissues and bones. Start light. Learn the movements. Add a little weight. Eat, sleep, recover, and repeat.</p><p><b>It's not rocket science — but it works.</b></p></div>

<div class="infoCard"><h3>Who is BVOM for?</h3><p>BVOM is primarily a <b>novice general-strength program</b>. It can build a foundation for intermediate strength training, powerlifting or bodybuilding. More strength also gives you greater potential to build muscle.</p><p>For someone with a busy life and no intention of making lifting a sport, cycling BVOM around work, sickness, holidays and other commitments may be all the strength programming they ever need. When an individual lift genuinely outgrows straight-set linear progression, BVOM can move that lift into <b>reverse pyramid training (RPT)</b> while the other lifts keep progressing normally. More advanced programming such as Heavy / Light / Medium can come later if you eventually need it.</p></div>

<div class="infoCard"><h3>Reverse pyramid training</h3><p>BVOM pushes straight-set progression for as long as it works. When a lift genuinely stalls, RPT can keep progression moving by combining a heavy top set with lighter, higher-rep back-offs. Rescue work after a failed main set remains a failed prescription: finish productively, then get it next time.</p></div>

<div class="infoCard"><h3>How to run BVOM</h3><p>BVOM works best as a <b>three-day-per-week A–B–A program</b>, with recovery between sessions where possible.</p><div class="programBox"><b>MONDAY — A</b><br>Squat 3×5<br>Bench Press 3×5<br>Row 3×5<br><br><b>WEDNESDAY — B</b><br>Squat 3×5<br>Press 5×5<br>Deadlift 1×5<br><br><b>FRIDAY — A</b><br>Squat 3×5<br>Bench Press 3×5<br>Row 3×5</div><p>Sunday / Tuesday / Thursday works just as well. Weekly frequency: Squat 3×, Bench 2×, Row 2×, Press 1× and Deadlift 1×.</p><p>The press is normally the lightest-tonnage core lift, so 5×5 provides useful volume. The deadlift is generally the heaviest lift and is highly fatiguing; overdoing it can interfere with recovery, especially alongside squatting three times per week.</p><p><b>BVOM does not recommend B–A–B.</b> Workout A is deliberately the foundation of the three-day program.</p><p>Only have two days? Use <b>A once and B once per week</b>. You'll still train all five core lifts with less weekly volume.</p></div>

<div class="infoCard"><h3>Leave your ego at the door</h3><p>Start light. Your body needs time to learn movement patterns before they become heavily loaded. Every working rep should use good technique and the intended <b>full range of motion</b>.</p><p>If technique is breaking down because you started too heavy, reduce the weight around <b>20%</b>, clean up the movement and work back up.</p></div>

<div class="infoCard"><h3>Progressive overload</h3><p>BVOM starts with <b>straight sets across</b>: the same working weight for all prescribed sets. Complete the work with good technique and BVOM progresses the lift next time.</p><div class="programBox">Squat +${isLb()?5:2.5} ${unitLabel()}<br>Bench +${isLb()?5:2.5} ${unitLabel()}<br>Row +${isLb()?5:2.5} ${unitLabel()}<br>Press +${isLb()?5:2.5} ${unitLabel()}<br>Deadlift +${isLb()?10:5} ${unitLabel()}</div><p>Small increases accumulated consistently over time can produce enormous changes.</p></div>

<div class="infoCard"><h3>When you miss a rep</h3><p>Eventually linear progression gets hard. BVOM transitions the remaining work into a <b>reverse-pyramid approach</b>: as the weight comes down, the reps go up.</p><div class="programBox"><b>Example — Squat ${isLb()?225:100} ${unitLabel()}, 3×5</b><br>${isLb()?225:100}×5<br>${isLb()?225:100}×5<br>${isLb()?225:100}×4 ❌<br><br>BVOM adds:<br><b>${isLb()?205:90}×5</b></div><p>If failure occurs earlier, BVOM can reduce the load again and increase the rep target, preserving productive training volume without repeatedly grinding against a weight you can't complete that day.</p></div>

<div class="infoCard"><h3>Before you deload</h3><p>Ask three questions: <b>Enough sleep? Enough food? Enough rest between sets?</b></p><p>Strength training isn't cardio. Warm-ups generally need no prescribed rest — if you're ready, go. Early working sets may need three minutes or less. As weights become heavier you'll naturally need longer. Five minutes is fine. If you need <b>10 minutes</b> to make the next heavy set, take 10 minutes.</p><p>If recovery is in order but you repeatedly stall, BVOM will guide you through its normal failure and progression options. Straight sets are pushed for as long as they work; RPT is the normal next step when a lift genuinely stalls. You remain in control of any manual deload.</p></div>

<div class="infoCard"><h3>Returning after time away</h3><p>Life happens. As a simple guide, after about <b>one week away</b>, reduce working weights around <b>10%</b>. After a longer layoff, around <b>20% or more</b> may be appropriate. Then resume gradual progression.</p><p>BVOM may remind you that starting lighter could be sensible, but it will <b>not automatically deload you</b>. You decide whether to reduce the weight and by how much.</p></div>

<div class="infoCard"><h3>Warm up — don't wear yourself out</h3><p>A warm-up prepares you for the working sets. BVOM calculates progressively heavier warm-ups and uses different patterns where appropriate. By rows or deadlifts you've already done substantial work, so unnecessary empty-bar sets aren't required.</p><p><b>Warm up enough to be ready. Don't turn the warm-up into the workout.</b></p></div>

<div class="infoCard"><h3>Strength Balance Guidance</h3><p>BVOM uses the five core lifts to flag significant strength imbalances. These ratios are <b>guidelines, not laws</b>. Body proportions, age, training history, injuries and natural strengths all influence individual lifts.</p></div>

<div class="infoCard"><h3>Accessories</h3><p>The core lifts remain the foundation. Optional accessories can target weaknesses, add muscle-building work or include movements you enjoy. They progress independently and <b>do not affect Strength Balance Guidance</b>.</p></div>

<div class="infoCard"><h3>Learn the lifts</h3><p>BVOM programs your training. Good instruction teaches you how to perform the lifts. These are recommended technique resources.</p>
<b>Squat</b><a class="resourceBtn" href="https://youtu.be/QhVC_AnZYYM?is=aCm2zqWWT5BD4L00" target="_blank">Squat technique — Mark Rippetoe / Art of Manliness ↗</a><a class="resourceBtn" href="https://youtu.be/vmNPOjaGrVE?is=5hZKKEZerlUYil53" target="_blank">Squat technique — Alan Thrall ↗</a>
<b>Bench Press</b><a class="resourceBtn" href="https://youtu.be/Bmjr4Q6je8I?is=ApBPJmk7sJLDLQYO" target="_blank">Bench technique ↗</a>
<b>Row</b><a class="resourceBtn" href="https://youtu.be/RQU8wZPbioA?is=dUoiEIA7q5S-4tv4" target="_blank">Barbell row — resource 1 ↗</a><a class="resourceBtn" href="https://youtu.be/6JVSjte9F-M?is=YkoUH0rQqGTMjFpH" target="_blank">Barbell row — Mark Rippetoe ↗</a>
<b>Overhead Press</b><a class="resourceBtn" href="https://youtu.be/CnBmiBqp-AI?is=OhMQaFQhKynsbJnJ" target="_blank">Press technique — Mark Rippetoe ↗</a>
<b>Deadlift</b><a class="resourceBtn" href="https://youtu.be/MBbyAqvTNkU?is=m_bJi87UI1Eni_sE" target="_blank">Deadlift technique — Alan Thrall ↗</a></div>

<div class="infoCard"><h3>The lifts aren't law</h3><p>BVOM recommends the basic barbell lifts, but the five core slots can be adapted to suit you, your equipment and your circumstances. <b>Squat</b> can be another squat variation. <b>Row</b> can be a seal row. <b>Press</b> may be a suitable machine press. <b>Deadlift</b> may be a rack pull.</p><p>Strength-balance ranges are guidance only. If you substitute a movement, the comparison may no longer mean much. That's okay — <b>you know what you're training.</b></p></div>

<div class="infoCard"><h3>Install BVOM</h3><p><b>Android:</b> Open BVOM in Chrome → three-dot menu → <b>Install app</b> (or Install and create shortcut) → follow the prompts.</p><p><b>iPhone / iPad:</b> Open BVOM in Safari → Share → <b>Add to Home Screen</b> → turn on <b>Open as Web App</b> → Add.</p></div>

<div class="infoCard"><h3>Your training data</h3><p>BVOM stores your weights, progression, accessories and history <b>locally on this device/browser</b>. Clearing browser/app data or changing devices may remove that information. Use <b>Export Backup</b> in Settings regularly; restoring a backup replaces the current device data.</p></div>

<div class="infoCard"><h3>BVOM does the thinking. You do the lifting.</h3><p>Learn the movements. Use full range of motion. Start light. Train consistently. Eat. Sleep. Recover. Add a little weight.</p><p><b>Become your Best Version.</b> 🐝🏋️</p></div>

function bvomWorkoutVolume(){

  let mult=1;
  if(key.startsWith('ACC:')){
   const id=key.slice(4),a=(state.accessoryList||[]).find(x=>x.id===id);
   if(a?.equipment==='dumbbell')mult=2; // accessory dumbbell loads are stored per dumbbell
  }
  for(const set of Object.values(obj||{})){
   if(!set||set.reps===undefined)continue;
   const load=Number(set.load),reps=Number(set.reps);

function bvomShareWorkoutText(h){
 if(!h)return '';
 const u=h.unit||'kg',d=new Date(h.date),date=isNaN(d.getTime())?String(h.date||''):d.toLocaleDateString(bvomDateLocale(),{day:'numeric',month:'short',year:'numeric'});
 let out=[`BVOM — Workout ${h.day||''}${h.incomplete?' · INCOMPLETE':''}`,date];
 let stats=[];if(h.duration)stats.push(`Duration: ${h.duration}`);if(Number.isFinite(h.volume))stats.push(`Volume: ${fmt(h.volume)} ${u}`);if(stats.length)out.push(stats.join(' · '));
 for(const [key,obj] of Object.entries(h.session||{})){
  const sets=Object.values(obj||{}).filter(v=>v&&v.reps!==undefined).map(v=>`${fmt(v.load||0)}×${v.reps}`).join(' · ');
  if(sets){let name;if(!key.startsWith('ACC:'))name=liftLabel(key);else{name=h.accessoryNames?.[key.slice(4)]||historyName(key)}out.push('',name,`${sets} ${u}`)}
 }
 if(h.note)out.push('','Session note',String(h.note));
 return out.join('\n');
}
async function shareHistoryWorkout(i){
 const h=state.history?.[i];if(!h)return;const text=bvomShareWorkoutText(h);const title=`BVOM — Workout ${h.day||''}`;
 try{
  if(navigator.share){await navigator.share({title,text});return}
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);alert('Workout copied to clipboard.');return}
  prompt('Copy workout summary:',text);
 }catch(e){if(e?.name!=='AbortError')alert('Could not share this workout.');}
}

   Add future languages by supplying another BVOM_LOCALES.<code> bundle and a selector. */
function bvomLocale(){
 const wanted=state.language||'en';
 return (globalThis.BVOM_LOCALES&&globalThis.BVOM_LOCALES[wanted])?wanted:'en';
}
function bvomLang(){return globalThis.BVOM_LOCALES[bvomLocale()]||globalThis.BVOM_LOCALES.en}
function bvomGet(path){let v=bvomLang();for(const k of path.split('.'))v=v?.[k];return v}
function bvomT(path,vars={}){
 let v=bvomGet(path);if(v==null){console.warn('Missing BVOM translation:',path);return path}
 if(typeof v!=='string')return v;
 return v.replace(/\{(\w+)\}/g,(_,k)=>vars[k]??`{${k}}`);
}
function changeLanguage(code){

}

 document.querySelectorAll('.tab').forEach(el=>{const k=map[el.dataset.tab];if(k)el.textContent=bvomT(k)});

const BVOM_ENTITLEMENT_OFFLINE_GRACE_MS=7*24*60*60*1000;

 try{localStorage.setItem(bvomEntitlementCacheKey(userId),JSON.stringify({userId,verifiedAt:new Date().toISOString(),record:row}))}catch(e){}
}
function bvomEntitlementCacheRead(userId){

function bvomEntitlementOfflineAccessDecision(userId){
 const owner=bvomLocalOwnerId(),cached=bvomEntitlementCacheRead(userId);
 if(!userId||!owner||owner!==userId||!cached)return {allowed:false,reason:'reconnect',row:cached?.record||null,fromCache:!!cached};
 const verifiedAt=Date.parse(cached.verifiedAt||''),age=Date.now()-verifiedAt;
 if(!Number.isFinite(verifiedAt)||age<-(5*60*1000)||age>BVOM_ENTITLEMENT_OFFLINE_GRACE_MS)return {allowed:false,reason:'reconnect',row:cached.record,fromCache:true};
 const row=cached.record||null;if(!row)return {allowed:false,reason:'reconnect',row:null,fromCache:true};
 if(row.user_id&&String(row.user_id)!==String(userId))return {allowed:false,reason:'reconnect',row,fromCache:true};
 const status=String(row.status||'').toLowerCase();
 if(status==='expired')return {allowed:false,reason:'expired',row,fromCache:true};
 if(status==='complimentary')return {allowed:true,reason:'offline_complimentary',row,fromCache:true};
 if(['subscriber','active','subscribed','subscription_active'].includes(status))return {allowed:true,reason:'offline_subscriber',row,fromCache:true};
 if(status==='trial_active'){
  const ends=Date.parse(row.trial_ends_at||'');
  if(Number.isFinite(ends)&&ends>Date.now())return {allowed:true,reason:'offline_trial_active',row,fromCache:true};

function bvomEntitlementAccessDecision(record,userId,allowOfflineCache=false){
 const liveRow=Array.isArray(record)?(record[0]||null):record;
 if(!liveRow){
  if(allowOfflineCache)return bvomEntitlementOfflineAccessDecision(userId);
  const cached=bvomEntitlementCacheRead(userId);
  return {allowed:false,reason:cached?'reconnect':'unconfirmed',row:cached?.record||null,fromCache:!!cached};
 }
 const row=liveRow,status=String(row.status||'').toLowerCase();
 if(status==='complimentary')return {allowed:true,reason:'complimentary',row,fromCache:false};
 if(['subscriber','active','subscribed','subscription_active'].includes(status))return {allowed:true,reason:'subscriber',row,fromCache:false};
 if(status==='trial_active'){
  const ends=Date.parse(row.trial_ends_at||'');
  if(!Number.isFinite(ends)||ends>Date.now())return {allowed:true,reason:'trial_active',row,fromCache:false};
  return {allowed:false,reason:'expired',row,fromCache:false};
 }
 if(status==='trial_not_started')return {allowed:true,reason:'trial_not_started',row,fromCache:false};

}

/* v2.5.1: compare cloud/device data after applying the same harmless defaults that
   current BVOM adds during startup. This prevents old-schema missing defaults from
   being mistaken for genuine user-data conflicts. The source objects are never mutated. */
function bvomCloudNormalizeForCompare(v){
 const d=JSON.parse(JSON.stringify(v||{}));
 d.session={};d.gppSession={};d.sessionOverrides={};d.processed={};d.processedSnapshots={};d.warmupDone={};d.warmupPlans={};d.timerStart=null;d.workoutStartedAt=null;d.hlmActiveWorkoutSettings=null;

 d.theme=d.theme||'classic';
 d.unit=d.unit||'kg';
 d.core=d.core||{};
 d.barByLift=d.barByLift||{};
 d.backupWorkoutCount=d.backupWorkoutCount||0;
 d.preRestoreBackup=d.preRestoreBackup||null;
 d.weights=d.weights||{};
 d.attempts=d.attempts||{};
 d.history=Array.isArray(d.history)?d.history:[];
 d.accessories=d.accessories||{A:[],B:[]};
 d.accessories.A=d.accessories.A||[];
 d.accessories.B=d.accessories.B||[];
 d.accessoryProgress=d.accessoryProgress||{};

 for(const n of Object.keys(d.weights)){
  d.core[n]=Object.assign({mode:'straight',increment:inc[n]||2.5,drop:(n==='Squat'||n==='Deadlift')?10:5,rptLevel:0},d.core[n]||{});
  if(d.barByLift[n]==null)d.barByLift[n]=d.bar||20;
 }

 let byName={};
 for(const day of ['A','B'])for(const a of (d.accessories[day]||[])){
  const key=(a.name||'').trim().toLowerCase();if(!key)continue;
  if(!byName[key])byName[key]=Object.assign({},a,{assignment:day,style:a.style||'straight',topReps:a.topReps||a.reps||8});
  else if(byName[key].assignment!==day)byName[key].assignment='Both';
 }
 d.accessoryList=d.accessoryList||Object.values(byName);
 for(const a of d.accessoryList){
  a.style=a.style||'straight';a.assignment=a.assignment||'A';a.topReps=a.topReps||a.reps||8;
  a.drop=a.drop||((a.category==='Lower')?10:5);a.increment=a.increment||2.5;a.equipment=a.equipment||'machine';a.plateMode=a.plateMode||'standard';

async function bvomCloudAssessSync(){

 if(bvomCloud.accountSwitchDeferred){bvomCloud.message=hlmTxt('Finish or exit the current workout, then reload BVOM before syncing.','現在のワークアウトを終了または中止してからBVOMを再読み込みし、同期してください。');bvomCloud.error=false;if(document.querySelector('#settings'))renderSettings();return}

 try{

    localStorage.removeItem('bvom_cloud_restore_baseline');bvomCloud.syncReady=true;bvomCloud.conflict=false;bvomCloud.workoutBaselineFingerprint=null;bvomCloud.message=hlmTxt('Cloud restore confirmed. Automatic backup is on.','クラウドからの復元を確認しました。自動バックアップはオンです。');

   else{
    bvomCloud.syncReady=same;bvomCloud.conflict=!same;
    bvomCloud.message=same?hlmTxt('Cloud and device match. Safe automatic backup is on.','クラウドとこの端末のデータは一致しています。安全な自動バックアップはオンです。'):hlmTxt('Device and cloud copies differ. Automatic upload is paused until you choose which copy to keep.','この端末とクラウドのデータが異なります。使用するデータを選ぶまで自動アップロードは一時停止します。');
    if(same){bvomCloud.workoutBaselineFingerprint=null;bvomCloud.conflictNoticeShown=false}
    else if(!bvomCloud.conflictNoticeShown){bvomCloud.conflictNoticeShown=true;setTimeout(()=>bvomCloudConflictNotice(),0)}
   }
  }

 const extra=bvomLocale()==='ja'?`<div class="infoCard"><h3>プログラムの選び方</h3><p><b>LP / RPT</b> は推奨の開始プログラムです。シンプルなワークアウトごとの進行で筋力を伸ばし、個々のリフトがストレートセットを卒業した時だけRPTへ移行できます。すべてのリフトを同時に変更する必要はありません。</p><p><b>HLM RPT</b> は中級者向けの3セッション構成です。<b>Heavy</b> は週の主なボリュームと負荷を作り、スクワットとベンチの進行を決めます。<b>Light</b> はアクティブリカバリーのスクワットにデッドリフトとプレスを組み合わせます。<b>Medium</b> はより重いスクワットとベンチ、その後のスパインロウで強度を表現します。Heavy は必ずしもバー重量が最も重い日という意味ではなく、トレーニングストレスが最も高い日です。H → L → M が通常の順番ですが、曜日には固定されません。</p><p>スクワットやベンチの進行が難しくなると、BVOMはそのリフトを<b>5回 → 4回 → 3回 → 2回</b>へ進めることを提案できます。BVOMは提案し、決めるのはあなたです。任意のヘビーシングルは練習／高重量への慣れのためで、進行判定には使いません。</p><p><b>4-Day Split</b> はLight dayを使わず、同じH/M RPTの考え方を使う中級者向けの別案です。Workout 1 はベンチ＋ロウ、Workout 2 はスクワット、Workout 3 はベンチ＋プレス、Workout 4 はスクワット＋デッドリフト。Workout 1 のベンチとWorkout 2 のスクワットが進行を決め、Workout 3と4で強度を表現します。月 / 火 / 木 / 金を推奨しますが、実際にはトレーニングするたびに1 → 2 → 3 → 4の順に進むだけです。</p><p><b>カスタムトレーニング — 自分で組む</b> は、自分でプログラムを組みたい人向けです。最大7日分のトレーニング日を作り、コンパウンド種目、補助種目、GPPを選べます。BVOMは記録して覚えますが、自動進行は行いません。<b>記録する → 覚えておく → あなたが決める。</b></p><p><b>ボディビルディング — 8週間トレーニングブロック</b> は、筋力重視のトレーニングから一度変化をつけながら、引き続き段階的にトレーニングしたい人向けです。24回の完了ワークアウトで構成され、Workout AとWorkout Bを交互に行い、より幅広い種目とレップ範囲を使います。ほとんどのセットは限界まで行わず、あと2回ほど良いレップができる余力を残し、BVOMが実際のパフォーマンスに基づいて進行を調整します。</p><p>ボディビルディング形式のトレーニングに慣れていない、または開始重量が分からない場合は、任意の<b>オンランプ</b>でWorkout 1の前に適切な開始重量を見つけることができます。オンランプは24回のワークアウトには含まれません。開始重量が分かっている経験者はスキップできます。</p><p><b>RPE</b> はHLM、4-Day、カスタムトレーニングの各ワークセットごとに記録されます。初期値は8で、6〜10の範囲を0.5刻みで調整できます。RPEは記録のためだけに使われ、BVOMの進行判定には影響しません。</p><p>BVOMでは足りなくなったら、より高度な筋力トレーニング方法やプログラミングを調べるか、経験豊富なストレングスコーチに相談することも検討してください。</p></div><div class="infoCard"><h3>マイクロプレート</h3><p>マイクロプレートは特にプレスで役立ち、体格が小さい人や筋力がまだ低い人が、スクワット、ベンチ、補助種目でもより細かな重量増加を使いたい場合に有効です。Equipmentでジムにあるマイクロプレートを選び、その後リフトや補助種目ごとに<b>Standard</b>または<b>Microplates</b>を選べます。</p><p>ジムにマイクロプレートがない場合は、小さなセットを購入してジムバッグに入れておくことをBVOMはおすすめします。</p></div><div class="infoCard"><h3>しっかり鍛える — 限界まで追い込まない</h3><p>BVOMは、バーが止まるまでレップを無理に続けることを前提にしていません。</p><p>重量が重くなったら、<b>あと何回きれいなレップができるか</b>を判断する感覚を身につけてください。ワークセットは<b>あと1〜2回きれいにできる余力</b>を残して終えることを目指します。</p><p>5回の指示でも、3回目の時点であと1〜2回しか良いレップが残っていないと分かるなら、<b>バーを戻して3回と記録してください</b>。BVOMがその結果を処理します。</p><p><b>できないことを証明するためだけに次の1回へ挑まない。</b></p><p>これはよく<b>RPE / RIR</b>と呼ばれます。あと2回できる余力は、おおよそRPE 8です。最初から完璧に判断する必要はありません。経験とともに上達します。</p></div><div class="infoCard"><h3>GPP（General Physical Preparedness）/ コンディショニング</h3><p><b>GPPはプログラムではなく、記録するための機能です。</b></p><p>筋力トレーニングと一緒に、ワークアウト後に、または別の日にも使えます。セット、回数、重量、距離、時間、ラウンドなど、必要な項目を記録できます。</p><p>BVOMは前回の内容を記憶しますが、GPPを自動的に進行させることはありません。同じ内容を繰り返すか、改善するか、変更するかはあなたが決めます。</p><p><b>記録する → 覚えておく → あなたが決める。</b></p></div>`:`<div class="infoCard"><h3>Choose the right program</h3><p><b>LP / RPT</b> is the recommended starting point. Build strength with simple workout-to-workout progression; when an individual lift outgrows straight sets, BVOM can move that lift into RPT without forcing every lift to change.</p><p><b>HLM RPT</b> is the three-session intermediate option. <b>Heavy</b> builds the week's main volume/stress and drives Squat and Bench progression. <b>Light</b> is active-recovery Squat followed by Deadlift and Press. <b>Medium</b> expresses intensity with heavier Squat and Bench work, then Supine Row. Heavy means the highest training stress — not necessarily the heaviest barbell weight. H → L → M is the normal rotation, but BVOM does not lock you to weekdays.</p><p>As Squat or Bench becomes harder to progress, BVOM can suggest moving that lift from <b>5s → 4s → 3s → 2s</b>. BVOM recommends; you decide. Optional heavy singles are practice/exposure only and never determine progression.</p><p><b>4-Day Split</b> is a parallel intermediate option using the same H/M RPT principles without a Light day. Workout 1 is Bench + Row, Workout 2 is Squat, Workout 3 is Bench + Press, and Workout 4 is Squat + Deadlift. Bench in Workout 1 and Squat in Workout 2 drive progression; Workouts 3 and 4 express intensity. Mon / Tue / Thu / Fri is recommended, but BVOM simply continues 1 → 2 → 3 → 4 whenever you train.</p><p><b>Custom Training — Build Your Own</b> is for lifters who want to program for themselves. Build up to seven training days, choose your compounds, accessories and GPP, and BVOM records and remembers what you do. There is no automatic progression: <b>Record → remember → you decide.</b></p><p><b>Bodybuilding — 8-Week Training Block</b> is for lifters who want a break from strength-focused training while continuing to train progressively. The block runs for 24 completed workouts, alternating Workout A and Workout B across a wider range of exercises and rep ranges. Most work is performed with about two good reps left rather than training to failure, and BVOM adjusts progression from your actual performance.</p><p>If you're unfamiliar with bodybuilding-style training or aren't sure what loads to use, the optional <b>On-Ramp</b> helps establish sensible starting loads before Workout 1. It does not count toward the 24-workout block. Experienced lifters who already know their starting loads can skip it.</p><p><b>RPE</b> is recorded per working set in HLM, 4-Day and Custom Training. It defaults to 8 and can be adjusted from 6–10 in 0.5 steps. RPE is a training record only — it never changes BVOM's progression decisions.</p><p>When BVOM is no longer enough, consider researching more advanced strength-training methods and programming techniques, or working with an experienced strength coach.</p></div><div class="infoCard"><h3>Microplates</h3><p>Microplates are especially useful for Press and for smaller or weaker lifters who may benefit from finer jumps on Squat, Bench and accessories too. Select the microplates your gym has in Equipment, then choose <b>Standard</b> or <b>Microplates</b> separately for each lift or accessory.</p><p>If your gym doesn't have microplates, BVOM recommends buying a small set and keeping them in your gym bag.</p></div><div class="infoCard"><h3>Train hard — not to failure</h3><p>BVOM is not designed around grinding out reps until the bar stops moving.</p><p>As the weight gets heavy, learn to judge how many <b>good reps you have left in the tank</b>. Aim to finish your work with about <b>1–2 clean reps still available</b>.</p><p>If you’re prescribed 5 reps, but after rep 3 you know you’ve only got another 1–2 good reps in you, <b>rack the bar and record 3</b>. BVOM will handle the result.</p><p><b>Don’t attempt a rep just to prove you can’t do it.</b></p><p>This is often described as <b>RPE/RIR</b>. Two reps left in the tank is roughly RPE 8. You don’t need to judge it perfectly — you’ll get better at it with experience.</p></div><div class="infoCard"><h3>GPP (General Physical Preparedness) / Conditioning</h3><p><b>GPP is a tracker, not a program.</b></p><p>Use it alongside your strength training, after a workout, or on a separate day. Track whatever matters — sets, reps, load, distance, time or rounds.</p><p>BVOM remembers what you did last time but doesn’t automatically progress your GPP. Repeat it, improve it, or change it as you choose.</p><p><b>Record → remember → you decide.</b></p></div>`;
