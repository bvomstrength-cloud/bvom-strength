name: Temporary vendor Supabase

on:
  push:
    branches:
      - dev/startup-resilience-v290-spec
    paths:
      - .github/workflows/vendor-supabase-temp.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: dev/startup-resilience-v290-spec
      - name: Vendor exact Supabase browser build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vendor-tmp vendor
          mkdir -p .vendor-tmp vendor
          cd .vendor-tmp
          npm pack @supabase/supabase-js@2.117.3
          tar -xzf supabase-supabase-js-2.117.3.tgz
          test -f package/dist/umd/supabase.js
          cp package/dist/umd/supabase.js ../vendor/supabase-js-2.117.3.js
          cd ..
          sha256sum vendor/supabase-js-2.117.3.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/supabase-js-2.117.3.js
          git commit -m "Vendor Supabase JS 2.117.3"
          git push origin HEAD:dev/startup-resilience-v290-spec
