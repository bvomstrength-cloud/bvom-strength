name: Package BVOM v2.8.5

on:
  push:
    branches:
      - "dev/package-v2.8.5"

permissions:
  contents: read

jobs:
  package:
    name: deterministic v2.8.5 package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release identifiers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "<title>BVOM Strength v2.8.5</title>" index.html
          grep -q "const BVOM_BUILD='2.8.5';" index.html
          grep -q 'sw.js?v=2.8.5' index.html
          grep -q "const CACHE = 'bvom-2.8.5';" sw.js

      - name: Build deterministic deployment ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED

          files = [
              "admin.html",
              "i18n/en.js",
              "i18n/ja.js",
              "icon-192.png",
              "icon-512.png",
              "index.html",
              "manifest.json",
              "og-image.png",
              "sw.js",
              "theme-bee-v23c.svg",
              "theme-cherry-v23f.svg",
              "theme-coastal-v23f.svg",
          ]
          out = "BVOM_Strength_v2.8.5.zip"
          with ZipFile(out, "w", compression=ZIP_DEFLATED, compresslevel=9) as z:
              for name in files:
                  data = Path(name).read_bytes()
                  info = ZipInfo(name, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, data)
          PY
          sha256sum BVOM_Strength_v2.8.5.zip | tee BVOM_Strength_v2.8.5.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: BVOM_Strength_v2.8.5
          path: |
            BVOM_Strength_v2.8.5.zip
            BVOM_Strength_v2.8.5.sha256
          if-no-files-found: error
          retention-days: 30
