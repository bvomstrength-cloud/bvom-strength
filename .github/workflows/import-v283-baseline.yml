name: Import approved BVOM v2.8.3 baseline

on:
  push:
    branches:
      - main
    paths:
      - BVOM_Strength_v2.8.3_MAINTENANCE_CANDIDATE_FINAL.zip

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and extract approved archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BVOM_Strength_v2.8.3_MAINTENANCE_CANDIDATE_FINAL.zip"
          EXPECTED_ZIP_SHA="8354302d31a4b1573e519cf0e3f2323f369aba3d4599eca984745a592b92286f"

          test -f "$ZIP"
          ACTUAL_ZIP_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL_ZIP_SHA" = "$EXPECTED_ZIP_SHA"

          rm -rf .baseline-import
          mkdir .baseline-import
          unzip -q "$ZIP" -d .baseline-import

          cat > /tmp/bvom-v283.sha256 <<'EOF'
4a102108a24db04b94e595e8ced64b2bb24755dc003a8a9c044adae35a3550ea  admin.html
ca8e7a101b80930624f8ec8a941ec0d526ecba4b190c80d2884b0fb59aa3cffd  i18n/en.js
2a86f7297fa9130cc6bfaf7a13398397fdf5a80b0d1d4c29945e1300163bfbba  i18n/ja.js
a324077b413d5248b2ac4146efd933daf33e169f8fe6149495a7844241bf6ef9  icon-192.png
cacdef4ebcc1a5ce4b7f0e26983d018d841791bc705ccabc584bcc0f38668909  icon-512.png
6411d9673ec086ccf93a339b6885dd73c50c349aff80fbc7a229e29cabb93179  index.html
35a9a065f02108420e44693e47238bea97300e515cac30c02cfac0ea594b073e  manifest.json
a5fba627849a5478c512b930ccbc5e717a45b0579a1908e9bd9b8f513c3038bd  og-image.png
3a9950d41b55005e74f26c8e964cb87949262d7e4886b12316f776481dd3cbcf  sw.js
e5f062cbcdfb7bb65cf257d30af469e213c91fb22d5a663b0d20a9e67ee88f96  theme-bee-v23c.svg
8484a007f349803bd3f8d05d8374c1216eaf5dbc37aff624ccceceffd873afaf  theme-cherry-v23f.svg
56240516bb5a3e8935e3ebe6d7b1d640ed975474986096240e2ce1b757b69c2d  theme-coastal-v23f.svg
EOF

          (
            cd .baseline-import
            sha256sum -c /tmp/bvom-v283.sha256
          )

          EXPECTED="$(awk '{print $2}' /tmp/bvom-v283.sha256 | sort)"
          ACTUAL="$(find .baseline-import -type f -printf '%P\n' | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit production baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP="BVOM_Strength_v2.8.3_MAINTENANCE_CANDIDATE_FINAL.zip"

          cp -a .baseline-import/. .
          rm -rf .baseline-import "$ZIP"

          # One-time importer: remove itself from the completed baseline.
          rm -f .github/workflows/import-v283-baseline.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "BVOM baseline importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import approved BVOM Strength v2.8.3 production baseline"
          git push
