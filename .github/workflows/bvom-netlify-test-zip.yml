name: BVOM Draft Netlify Test ZIP

# Draft-only, no deployment. Produces a versioned static ZIP for manual testing.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-manual-test-site:
    name: Package PR candidate for manual Netlify Drop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR candidate
        uses: actions/checkout@v4

      - name: Assemble exact static candidate
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$(grep -oE "BVOM_BUILD='[0-9.]+'" index.html | head -1 | cut -d "'" -f2)"
          SW_BUILD="$(grep -oE "const BUILD = '[0-9.]+'" sw.js | head -1 | cut -d "'" -f2)"
          test -n "$BUILD" && test "$BUILD" = "$SW_BUILD"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          ZIP="BVOM-v${BUILD}-PR${PR_NUMBER}-TEST.zip"
          mkdir -p .bvom-netlify-test/i18n .bvom-netlify-test/vendor .bvom-netlify-test/bb2
          cp index.html admin.html sw.js manifest.json .bvom-netlify-test/
          # Only the manually uploaded test-site copy of sw.js is changed.
          # Production source keeps its release version. A PR's app JS can
          # change without its release number changing; if the cache token
          # stays the same, existing test-site users remain on stale HTML.
          TEST_CACHE="bvom-${BUILD}-pr${PR_NUMBER}-${SOURCE_SHA:0:12}"
          export TEST_CACHE
          python3 - <<'PY'
          import os, pathlib, re
          sw = pathlib.Path('.bvom-netlify-test/sw.js')
          original = sw.read_text()
          changed, count = re.subn(r"(?m)^const CACHE = '[^']+';$",
                                   "const CACHE = '" + os.environ['TEST_CACHE'] + "';",
                                   original, count=1)
          if count != 1 or original == changed:
              raise SystemExit('Cannot set unique test-only service-worker cache')
          sw.write_text(changed)
          PY
          grep -F "const CACHE = '${TEST_CACHE}';" .bvom-netlify-test/sw.js
          cp icon-192.png icon-512.png og-image.png .bvom-netlify-test/
          cp theme-bee-v23c.svg theme-cherry-v23f.svg theme-coastal-v23f.svg .bvom-netlify-test/
          cp i18n/en.js i18n/ja.js .bvom-netlify-test/i18n/
          cp vendor/supabase-js-2.117.3.js .bvom-netlify-test/vendor/
          cp bb2/browser-core.mjs .bvom-netlify-test/bb2/
          printf '%s\n' 'BVOM VERSIONED TEST SITE - NOT PRODUCTION' \
            'Manual upload to a DIFFERENT Netlify site only.' \
            'Uses the SAME cloud backend as normal BVOM; sign in ONLY with a disposable test account.' \
            "App version: ${BUILD}" "Source PR: #${PR_NUMBER}" "Source head commit: ${SOURCE_SHA}" \
            "Test-only SW cache: ${TEST_CACHE}" \
            > .bvom-netlify-test/NETLIFY-TEST-BUILD.txt
          test -s .bvom-netlify-test/index.html
          test -s .bvom-netlify-test/vendor/supabase-js-2.117.3.js
          test -s .bvom-netlify-test/i18n/en.js
          test -s .bvom-netlify-test/i18n/ja.js
          test -s .bvom-netlify-test/bb2/browser-core.mjs
          (cd .bvom-netlify-test && zip -q -r "../${ZIP}" .)
          unzip -t "$ZIP" | tail -2
          printf '%s\n' 'NETLIFY ZIP CONTENTS:'
          unzip -Z1 "$ZIP" | head -35

      - name: Upload ZIP for owner
        uses: actions/upload-artifact@v4
        with:
          name: BVOM-PR${{ github.event.pull_request.number }}-Netlify-Test-Site
          path: BVOM-v*-PR*-TEST.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
