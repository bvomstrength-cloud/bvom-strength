name: Temporary package v2.9 test builds

on:
  push:
    branches:
      - dev/startup-resilience-v290-spec
    paths:
      - .github/workflows/package-v290-temp.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Stage exact and diagnostic test builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bvom-v290-exact bvom-v290-diagnostic
          for d in bvom-v290-exact bvom-v290-diagnostic; do
            mkdir -p "$d/i18n" "$d/vendor"
            cp index.html admin.html sw.js manifest.json icon-192.png icon-512.png og-image.png \
              theme-bee-v23c.svg theme-cherry-v23f.svg theme-coastal-v23f.svg "$d/"
            cp i18n/en.js i18n/ja.js "$d/i18n/"
            cp vendor/supabase-js-2.117.3.js "$d/vendor/"
          done
          python - <<'PY'
          from pathlib import Path
          p=Path('bvom-v290-diagnostic/index.html')
          s=p.read_text()
          marker='''<script id="bvom-v290-test-diag">
          (()=>{try{
            const q=new URLSearchParams(location.search);if(q.get('bootdiag')!=='1')return;
            const marks={diagScript:performance.now(),domContentLoaded:null,windowLoad:null,appVisible:null};
            function appIsVisible(){const x=document.querySelector('#app');return !!x&&!x.classList.contains('hidden')}
            function render(){
              if(appIsVisible()&&marks.appVisible==null)marks.appVisible=performance.now();
              let el=document.getElementById('bvomV290Diag');
              if(!el){el=document.createElement('details');el.id='bvomV290Diag';el.open=true;el.style.cssText='position:fixed;left:6px;right:6px;bottom:6px;z-index:300000;max-height:44vh;overflow:auto;background:#111;color:#fff;border:1px solid #777;border-radius:8px;padding:8px;font:12px/1.4 monospace;white-space:pre-wrap';el.innerHTML='<summary style="cursor:pointer;font-weight:800">BVOM v2.9 STARTUP DIAGNOSTICS</summary><pre style="margin:6px 0 0;white-space:pre-wrap"></pre>';document.body.appendChild(el)}
              const n=performance.getEntriesByType('navigation')[0];
              const lines=[];
              if(n)lines.push('responseStart='+n.responseStart.toFixed(1)+'ms  responseEnd='+n.responseEnd.toFixed(1)+'ms','domInteractive='+n.domInteractive.toFixed(1)+'ms');
              lines.push('diagScript='+marks.diagScript.toFixed(1)+'ms','DOMContentLoaded='+(marks.domContentLoaded==null?'pending':marks.domContentLoaded.toFixed(1)+'ms'),'windowLoad='+(marks.windowLoad==null?'pending':marks.windowLoad.toFixed(1)+'ms'),'appVisible='+(marks.appVisible==null?'pending':marks.appVisible.toFixed(1)+'ms'),'startupState='+(window.bvomCloud?.startupState||'n/a'),'offlineLocalAccess='+(window.bvomCloud?.offlineLocalAccess??'n/a'));
              el.querySelector('pre').textContent=lines.join('\n');
            }
            document.addEventListener('DOMContentLoaded',()=>{marks.domContentLoaded=performance.now();render()});
            window.addEventListener('load',()=>{marks.windowLoad=performance.now();render();setTimeout(render,250);setTimeout(render,1000)});
            const mo=new MutationObserver(()=>{if(appIsVisible()&&marks.appVisible==null){marks.appVisible=performance.now();render()}});
            const arm=()=>{const x=document.querySelector('#app');if(x)mo.observe(x,{attributes:true,attributeFilter:['class']});render()};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arm,{once:true});else arm();
          }catch(e){console.log('BVOM v2.9 diagnostic:',e)}})();
          </script>'''
          if '</body>' not in s: raise SystemExit('no </body>')
          p.write_text(s.replace('</body>',marker+'\n</body>',1))
          PY
          echo "Exact files:"
          find bvom-v290-exact -type f -print | sort
          echo "Exact tree SHA256:"
          find bvom-v290-exact -type f -print0 | sort -z | xargs -0 sha256sum
      - name: Upload exact test build
        uses: actions/upload-artifact@v4
        with:
          name: BVOM_v2.9.0_EXACT_TEST
          path: bvom-v290-exact
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostic test build
        uses: actions/upload-artifact@v4
        with:
          name: BVOM_v2.9.0_DIAGNOSTIC_TEST
          path: bvom-v290-diagnostic
          if-no-files-found: error
          retention-days: 7
