name: F44 Verification

on:
  push:
    branches:
      - fix/active-workout-cloud-restore-guard

permissions:
  contents: read

jobs:
  f44-verify:
    name: F44 active-workout cloud restore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run F44 only
        run: node tests/bvom-lab/behaviour_guard.js . --only=F44-ACTIVE-WORKOUT-CLOUD-RESTORE-GUARD
