name: BVOM Lab

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-regression-gate:
    name: v15.2 full regression gate
    runs-on: ubuntu-latest
    # The full gate includes both the existing application block and the
    # focused shared-progression seal/carry fixture; retain all mutation checks.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check out exact v3.0.1 for extra-set feature provenance
        uses: actions/checkout@v4
        with:
          ref: b990d8385e2e4dc57ceea859994f11c9b7d756fa
          path: .bvom-extra-baseline
      - name: Prove six extra-set contracts fail on the unchanged production baseline
        run: |
          if node tests/bvom-lab/behaviour_guard.js .bvom-extra-baseline --only=CORE-EXTRAS-PROGRESSION,CORE-EXTRAS-DECISION-BRANCHES,CORE-EXTRAS-LIFECYCLE,CORE-EXTRAS-SAFETY,CORE-EXTRAS-RECOVERY-UNITS,CORE-EXTRAS-PENDING-DRIVER --json > /tmp/bvom-extra-red.json; then
            echo "ERROR: production baseline unexpectedly passed the new feature contracts"
            exit 1
          fi
          node -e "const a=require('node:assert/strict'),r=require('/tmp/bvom-extra-red.json');a.equal(r.length,6);a.ok(r.every(t=>!t.pass));console.log('PASS: 6/6 new extra-set contracts RED on exact v3.0.1')"

      - name: Check out exact v3.0.2 for display and progression comparison
        uses: actions/checkout@v4
        with:
          ref: 2e93b4dbb098bba4a4e8bba23b9451449a9e20f9
          path: .bvom-weight-baseline
      - name: Prove display contracts fail on v3.0.2
        run: |
          if node tests/bvom-lab/behaviour_guard.js .bvom-weight-baseline --only=WORKING-WEIGHT-LP-RPT,WORKING-WEIGHT-INTERMEDIATE,WORKING-WEIGHT-FAIL-DECISION,WORKING-WEIGHT-MANUAL-EXTRAS --json > /tmp/bvom-weight-red.json; then
            exit 1
          fi
          node -e "const a=require('node:assert/strict'),r=require('/tmp/bvom-weight-red.json');a.equal(r.length,4);a.ok(r.every(t=>!t.pass))"
      - name: Compare progression and History to exact v3.0.2
        run: node tests/bvom-lab/working_weight_baseline.cjs .bvom-weight-baseline

      - name: Stage production candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bvom-candidate
          mkdir -p .bvom-candidate/i18n .bvom-candidate/vendor .bvom-candidate/bb2

          cp index.html .bvom-candidate/
          cp admin.html .bvom-candidate/
          cp sw.js .bvom-candidate/
          cp manifest.json .bvom-candidate/
          cp icon-192.png .bvom-candidate/
          cp icon-512.png .bvom-candidate/
          cp og-image.png .bvom-candidate/
          cp theme-bee-v23c.svg .bvom-candidate/
          cp theme-cherry-v23f.svg .bvom-candidate/
          cp theme-coastal-v23f.svg .bvom-candidate/
          cp i18n/en.js .bvom-candidate/i18n/
          cp i18n/ja.js .bvom-candidate/i18n/
          cp vendor/supabase-js-2.117.3.js .bvom-candidate/vendor/
          cp bb2/browser-core.mjs .bvom-candidate/bb2/
          cp bb2/browser-host.mjs bb2/app-session.mjs bb2/cloud-sidecar.mjs bb2/cloud-coordinator.mjs .bvom-candidate/bb2/
          test -s .bvom-candidate/bb2/browser-core.mjs
          test -s .bvom-candidate/bb2/cloud-coordinator.mjs

          echo "Staged BVOM production candidate:"
          find .bvom-candidate -type f -print | sort

      - name: Run BVOM Lab v15.2 gate
        run: |
          node tests/bvom-lab/gate.js \
            .bvom-candidate \
            test-fixtures/v2.8.0-known-bad
