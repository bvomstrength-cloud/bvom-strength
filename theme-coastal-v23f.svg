<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3200" viewBox="0 0 1440 3200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ccecf9"/>
    <stop offset=".48" stop-color="#e3f6fb"/>
    <stop offset=".74" stop-color="#eef9f8"/>
    <stop offset="1" stop-color="#ead6a6"/>
  </linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
